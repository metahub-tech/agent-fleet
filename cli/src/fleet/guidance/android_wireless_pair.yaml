step:
  id: "android_wireless_pair"
  title: "Wireless / Hybrid 配对（可选）/ Wireless or Hybrid pairing (optional)"
  default_description: |
    如果你选了 USB 模式，可跳过这一步直接回车。

    Wireless（Android 11+ / SDK 30+，phone 上有原生 "Wireless debugging" 菜单）：
        adb pair <PHONE_IP>:<PAIRING_PORT>     # 输入手机显示的 6 位配对码
        adb connect <PHONE_IP>:5555            # ADB port，与 pairing port 不同

    Hybrid（Android 5-10，含 HarmonyOS 4 报 SDK29 机型如 Huawei P30 Pro）：
        adb tcpip 5555                          # 先插 USB → 切到 TCP
        adb connect <PHONE_IP>:5555             # 之后可拔线
        # 注意：手机重启后失效，需重插 USB 再 `adb tcpip 5555`

    完整对照（哪种机型选哪种 / 故障排查 / 重启后行为）见独立文档：

        https://github.com/metahub-tech/agent-fleet/blob/main/docs/android-setup.md#step-3-pick-a-connection-method

    完成后回车继续。
