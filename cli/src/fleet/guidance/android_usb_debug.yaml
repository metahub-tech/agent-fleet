step:
  id: "android_usb_debug"
  title: "USB 调试授权 / USB Debugging Authorization"
  default_description: |
    1. 开发者选项 → **USB debugging** ON
    2. 用 USB 线连接手机和电脑
    3. 手机弹出 "Allow USB debugging?" → 勾选 **"Always allow from this computer"** → Allow
    4. 在电脑上跑 `adb devices`：看到设备列出 = OK

    OEM-specific quirks（华为 HiSuite 驱动 / 小米账号要求 / 多个 OPPO/vivo
    机型 USB 调试会自动失效）见独立文档：

        https://github.com/metahub-tech/agent-fleet/blob/main/docs/platforms/android.md#step-2-enable-usb-debugging

    完成后回车继续。
