step:
  id: "android_dev_options"
  title: "开启开发者选项 / Enable Developer Options"
  default_description: |
    在手机 Settings 里找到 "Build number" / "版本号" 字段，**连按 7 次**解锁开发者选项。

    各家 OEM 路径不同（华为 / 小米 / Samsung / OPPO / vivo / Pixel / OnePlus / ...）。
    完整对照表 + 故障排查见独立文档：

        https://github.com/metahub-tech/agent-fleet/blob/main/docs/platforms/android.md#step-1-enable-developer-options

    解锁成功后会有 "You are now a developer!" 提示。完成后回车继续。
