[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-fleet"
version = "0.7.2a1"
description = "One-command CLI to install agent-fleet MCP servers and generate agent-client config."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "MetaHub Tech"}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "questionary>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "rich>=13.0",
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/metahub-tech/agent-fleet"
Repository = "https://github.com/metahub-tech/agent-fleet"
Changelog = "https://github.com/metahub-tech/agent-fleet/blob/main/CHANGELOG.md"

[project.scripts]
agent-fleet = "fleet.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/fleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
