[platform]
id           = "win-device"
display_name = "Windows 10/11"
port         = 8766
status       = "released"
multi_device = false
host_os      = ["windows"]

[server]
module = "win_device_mcp"

# Capability modules to enable on this host (core is always on; design §3.7).
# Optional modules (e.g. browser) get added here once implemented (Phase 2).
# Overridable per-host via <repo_root>/.fleet/config.toml [capabilities].enabled.
[capabilities]
enabled = ["core"]

[install]
setup_script = "scripts/setup-windows.ps1"
guidance     = ["windows_postinstall.yaml"]

