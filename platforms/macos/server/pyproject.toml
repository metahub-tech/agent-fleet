[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-fleet-macos"
version = "0.8.3a1"
description = "macOS platform MCP bridge for agent-fleet"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "MetaHub Tech" }
]
keywords = ["mcp", "claude", "agent", "macos", "test-automation", "gui-testing", "tailscale"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastmcp>=2.0,!=3.3.1",
    "pyautogui>=0.9.54",
    "psutil>=5.9",
    "pillow>=10.0",
    "pyperclip>=1.8",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/metahub-tech/agent-fleet"
Repository = "https://github.com/metahub-tech/agent-fleet"
Issues = "https://github.com/metahub-tech/agent-fleet/issues"

[tool.setuptools]
py-modules = ["mac_device_mcp"]
