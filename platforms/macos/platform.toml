[platform]
id           = "mac-device"
display_name = "macOS"
port         = 8767
status       = "released"
multi_device = false
host_os      = ["macos"]

[server]
module = "mac_device_mcp"

[install]
setup_script = "scripts/setup-macos.sh"
guidance     = ["macos_accessibility.yaml", "macos_screen_recording.yaml", "macos_automation.yaml", "macos_full_disk_access.yaml"]

[tools.aliases]
tap                = "click"
acquire            = "acquire_mac"
release            = "release_mac"
get_status         = "get_mac_status"
dump_ui            = "list_ui_elements"
terminate_app      = "kill_process"
# P1b implemented swipe (click-drag) + the single-device tools current_app/
# list_devices/set_default_device/get_default_device directly under their canonical
# names (no aliases needed); KNOWN_P1_GAPS is now {}.
