[platform]
id           = "mac-device"
display_name = "macOS"
port         = 8767
status       = "released"
multi_device = false
host_os      = ["macos"]

[server]
module = "mac_device_mcp"

# Capability modules to enable on this host (core is always on; design §3.7).
# Optional modules (e.g. browser) get added here once implemented (Phase 2).
# Overridable per-host via <repo_root>/.fleet/config.toml [capabilities].enabled.
[capabilities]
enabled = ["core"]

[install]
setup_script = "scripts/setup-macos.sh"
guidance     = ["macos_accessibility.yaml", "macos_screen_recording.yaml", "macos_automation.yaml", "macos_full_disk_access.yaml"]

# P1b implemented swipe (click-drag) + the single-device tools current_app/
# list_devices/set_default_device/get_default_device directly under their canonical
# names (no aliases needed); KNOWN_P1_GAPS is now {}.
# P3 renamed CORE tools to canonical names (tap/acquire/release/get_status) and
# added dump_ui/terminate_app directly — no aliases required.
