[platform]
id           = "android-device"
display_name = "Android"
port         = 8768
status       = "released"
multi_device = true
host_os      = ["windows", "macos", "linux"]

[server]
module = "android_device_mcp"

[install]
setup_script = "scripts/setup-android.sh"
guidance     = ["android_dev_options.yaml", "android_usb_debug.yaml", "android_wireless_pair.yaml"]

[install.setup_script_by_os]
windows = "scripts/setup-android.ps1"
linux   = "scripts/setup-android-linux.sh"
# macos falls back to the default setup_script (scripts/setup-android.sh)

[install.config_reuse]
check_path = "~/.atb-android/config.toml"
env        = "ATB_ANDROID_REUSE_CONFIG"

[install.options.mode]
prompt  = "ADB connection mode"
env     = "ATB_ANDROID_MODE"
choices = [
  { value = "usb",      label = "USB only  (cable required; per-plug auth on phone)" },
  { value = "wireless", label = "Wireless Debugging  (Android 11+ / HarmonyOS 4 native pairing)" },
  { value = "hybrid",   label = "Hybrid  (USB enroll then adb tcpip 5555; Android 5-10)" },
]

[tools.aliases]
acquire        = "acquire_android"
release        = "release_android"
get_status     = "get_android_status"
dump_ui        = "dump_ui_hierarchy"
terminate_app  = "kill_app"
