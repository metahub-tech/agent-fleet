[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-fleet-android"
version = "0.8.4a1"
description = "Android device MCP bridge for agent-fleet (drives Android via ADB)"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "MetaHub Tech" }
]
keywords = ["mcp", "claude", "agent", "android", "adb", "test-automation", "mobile-testing", "tailscale"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastmcp>=2.0,!=3.3.1",
    "pillow>=10.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/metahub-tech/agent-fleet"
Repository = "https://github.com/metahub-tech/agent-fleet"
Issues = "https://github.com/metahub-tech/agent-fleet/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["android_device_mcp"]
